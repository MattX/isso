name: Python tests

on:
  push:
  pull_request:

jobs:
  test:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:

    - name: Check out repository code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        # Dependencies are in setup.py, so use it as cache key
        cache-dependency-path: 'setup.py'

    - name: Install isso dependencies
      # Use pip instead of python setup.py develop to get caching from
      # "setup-python" action
      run: pip install -e .

    - name: Install test suite dependencies
      run: pip install pytest pytest-cov

    - name: Run test suite
      run: make test
      env:
        PYTHONHASHSEED: random

  datastore:

    runs-on: ubuntu-latest

    steps:

    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install Isso with Datastore and test dependencies
      run: pip install -e '.[datastore,test]'

    - name: Run Datastore backend tests
      run: pytest isso/tests/test_datastore.py

  lint:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Use only single build env for linting
        os: [ubuntu-latest]
        python-version: ["3.10"]
      fail-fast: false

    steps:

    - name: Check out repository code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        # Dependencies are in setup.py, so use it as cache key
        cache-dependency-path: 'setup.py'

    - name: Install Isso with Datastore and test dependencies
      run: pip install -e '.[datastore,test]'

    - name: Install style check dependencies
      run: pip install ruff

    - name: Run style check
      run: make flakes

    - name: Run format check
      run: make format-check

    - name: Run coverage check, fail if <70%
      run: |
        make coverage
        coverage report --fail-under 70
