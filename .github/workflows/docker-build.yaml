name: Docker build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build deployment-neutral image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: isso:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start image with a runtime-mounted configuration
        run: |
          docker run --detach --name isso-test --publish 8080:8080 \
            --mount type=bind,source="$PWD/contrib/isso-dev.cfg",target=/config/isso.cfg,readonly \
            isso:test

      - name: Verify container health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8080/info; then
              exit 0
            fi
            sleep 1
          done
          docker logs isso-test
          exit 1

      - name: Stop test container
        if: always()
        run: docker rm --force isso-test
